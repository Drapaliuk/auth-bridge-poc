<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>Logging process...</div>
</body>

<script>
    const TOKEN_KEY = 'test-bridge-token-key';
    const bp_v1_auth_bridge_login_url = 'http://127.0.0.1:5501/bp_v1_auth-bridge-login.html'


    window.addEventListener('DOMContentLoaded', shareTokenAndClose);

    function shareTokenAndClose() {
        if (window.opener) {

            const token = localStorage.getItem(TOKEN_KEY);
            window.opener.postMessage(
                { request: 'provide-token', token: token },
                bp_v1_auth_bridge_login_url
            );
        }

        window.close();

    }

</script>

</html>
